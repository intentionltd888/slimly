<!doctype html>
<meta charset="utf-8">
<title>Slimly 編輯器</title>
<style>
  /* ───────────────────────────────────────────────────────────────
     Slimly 的 PDF 編輯器（對齊 Acrobat）。設計語彙＝主視窗同一套（Fully 2.2）：凸＝可按、凹＝容器／已選、平＝不能按；
     形狀三種（圓／膠囊 999／方塊 24，鍵帽 8、小圖塊 12）；字四階 28／15／13／11；藍 #003CFF 只給進度的頭。
     版面照 Acrobat 的工作方式分：上＝六個模式（編輯、註解、填寫與簽名、表單、塗黑與保護、頁面）＋復原／縮放／存檔；
     第二排＝這個模式的工具；左＝頁、書籤、註解清單；中＝頁面；右＝選到的東西的格式＋這個模式的文件工具＋整份文件（存檔、匯出、翻譯…）。
     座標：物件一律存「顯示方向的點、原點左上」，畫面 × 縮放；存檔時 Swift（EditorEngine.swift）用同一套畫。
     改原本的字：畫面上量好每一行、每一段樣式的位置交給 Swift 照畫；原本那幾行交給 MuPDF 真的刪掉（預覽也是真的刪掉後的樣子）。
     ─────────────────────────────────────────────────────────────── */
  :root {
    --material: #EEEFF2; --shade: 163,166,175; --hi: 255,255,255; --hi-a: .95; --lo-a: .45;
    --ink: #282A2F; --ink-mid: #5F626A; --ink-off: #A2A5AD; --hair: rgba(163,166,175,.30);
    --blue: #003CFF; --well: #E6E8EC;
    --font: -apple-system, "PingFang TC", sans-serif;
    --doc: "PingFang TC", "Helvetica Neue", sans-serif;
    --raise-lg: -10px -10px 20px rgba(var(--hi),var(--hi-a)), 10px 10px 20px rgba(var(--shade),var(--lo-a));
    --raise-sm: -3px -3px 6px rgba(var(--hi),var(--hi-a)), 3px 3px 6px rgba(var(--shade),var(--lo-a));
    --deboss:   inset 3px 3px 6px rgba(var(--shade),var(--lo-a)), inset -3px -3px 6px rgba(var(--hi),var(--hi-a));
    --checked:  3px 3px 6px rgba(var(--shade),var(--lo-a)), -3px -3px 6px rgba(var(--hi),var(--hi-a)),
                inset 3px 3px 6px rgba(var(--shade),var(--lo-a)), inset -3px -3px 6px rgba(var(--hi),var(--hi-a));
    --sheet: 0 1px 2px rgba(0,0,0,.10), 0 6px 18px rgba(var(--shade),.45);
    --tsel: rgba(40,42,47,.18);
    color-scheme: light;
  }
  :root[data-theme="dark"], :root:not([data-theme="light"]).sysdark {
    --material: #2A2C31; --shade: 0,0,0; --hi-a: .06; --lo-a: .55;
    --ink: #E6E7EA; --ink-mid: #A8ABB3; --ink-off: #6B6E76; --hair: rgba(255,255,255,.07); --well: #232529;
    --checked:  3px 3px 6px rgba(0,0,0,.55), -1px -1px 4px rgba(255,255,255,.16), inset 3px 3px 6px rgba(0,0,0,.55), inset -1px -1px 4px rgba(255,255,255,.16);
    --sheet: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.45);
    color-scheme: dark;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: var(--font); color: var(--ink); background: var(--material); -webkit-font-smoothing: antialiased; user-select: none; cursor: default; font-size: 13px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:disabled { cursor: default; color: var(--ink-off); }
  button:focus-visible { outline: 2px solid var(--ink-mid); outline-offset: 2px; }
  input, textarea, select { font: inherit; color: inherit; user-select: text; }
  .hide { display: none !important; }
  svg { width: 18px; height: 18px; display: block; flex: 0 0 auto; }
  svg * { stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .t-title { font-weight: 600; font-size: 15px; line-height: 22px; }
  .t-body  { font-size: 13px; line-height: 20px; color: var(--ink-mid); }
  .t-cap   { font-size: 11px; line-height: 16px; color: var(--ink-mid); }
  .one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link { font-size: 13px; line-height: 20px; color: var(--ink-mid); white-space: nowrap; }
  .link:hover { color: var(--ink); }
  .link.sm { font-size: 11px; line-height: 16px; }

  .ed { position: absolute; inset: 0; display: grid; grid-template-columns: 208px minmax(0, 1fr) 300px; grid-template-rows: 56px 48px minmax(0, 1fr); }
  body.busy .ed { pointer-events: none; }
  body[data-mode="pages"] .ed { grid-template-columns: 0 minmax(0, 1fr) 300px; }
  body[data-mode="pages"] .side { display: none; }

  /* 上：模式＋復原／縮放／存檔 */
  .tb { grid-column: 1 / -1; grid-row: 1; display: flex; align-items: center; gap: 16px; padding: 0 20px 0 16px; min-width: 0; }
  .modes { display: inline-flex; gap: 8px; flex: 0 1 auto; min-width: 0; overflow: hidden; padding: 6px 4px; }
  .modes button { height: 32px; padding: 0 14px; border-radius: 999px; box-shadow: var(--raise-sm); font-size: 13px; color: var(--ink-mid); white-space: nowrap; transition: box-shadow .14s ease-out; }
  .modes button.on { box-shadow: var(--checked); color: var(--ink); font-weight: 600; }
  .grow { flex: 1 1 auto; }
  .right { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-mid); flex: 0 0 auto; }
  .ic:hover:not(:disabled) { color: var(--ink); box-shadow: var(--raise-sm); }
  .ic.on { box-shadow: var(--checked); color: var(--ink); }
  .ic svg { width: 16px; height: 16px; }
  .zv { min-width: 52px; height: 28px; font-size: 11px; color: var(--ink-mid); font-variant-numeric: tabular-nums; border-radius: 999px; }
  .zv:hover { color: var(--ink); }
  .pnav { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border-radius: 999px; box-shadow: var(--deboss); font-size: 11px; color: var(--ink-mid); font-variant-numeric: tabular-nums; }
  .pnav input { width: 30px; border: 0; outline: 0; background: transparent; text-align: right; font-size: 11px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .cap-key { height: 40px; padding: 0 20px; border-radius: 999px; box-shadow: var(--raise-sm); display: inline-flex; align-items: center; gap: 8px;
             font-weight: 600; font-size: 13px; color: var(--ink); white-space: nowrap; transition: box-shadow .14s ease-out; }
  .cap-key:active { box-shadow: var(--deboss); }
  .cap-key.lg { box-shadow: var(--raise-lg); margin-left: 8px; }
  .cap-key.sm { height: 30px; padding: 0 12px; font-size: 11px; }
  .cap-key:disabled { box-shadow: none; color: var(--ink-off); }

  /* 第二排：這個模式的工具 */
  .toolrow { grid-column: 1 / -1; grid-row: 2; display: flex; align-items: center; gap: 8px; padding: 0 20px 0 16px; border-bottom: 1px solid var(--hair); min-width: 0; }
  .tools { display: flex; gap: 8px; flex: 0 0 auto; align-items: center; }
  .tools .sep { width: 1px; height: 22px; background: var(--hair); margin: 0 4px; }
  .tk { width: 34px; height: 34px; border-radius: 8px; box-shadow: var(--raise-sm); display: grid; place-items: center; color: var(--ink-mid); transition: box-shadow .14s ease-out; position: relative; }
  .tk:hover { color: var(--ink); }
  .tk.on { box-shadow: var(--checked); color: var(--ink); }
  .tk.txt { width: auto; padding: 0 12px; font-size: 11px; gap: 6px; display: inline-flex; align-items: center; white-space: nowrap; }
  .hint { flex: 1 1 auto; min-width: 0; font-size: 11px; line-height: 16px; color: var(--ink-mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 8px; }

  /* 左：頁、書籤、註解 */
  .side { grid-row: 3; grid-column: 1; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--hair); }
  .stabs { display: flex; justify-content: center; gap: 6px; padding: 10px 12px 6px; }
  .stabs button { height: 26px; padding: 0 10px; border-radius: 999px; font-size: 11px; color: var(--ink-mid); box-shadow: var(--raise-sm); }
  .stabs button.on { box-shadow: var(--checked); color: var(--ink); font-weight: 600; }
  .sbody { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
  .sbody::-webkit-scrollbar { width: 0; }
  .thumbs { padding: 10px 20px 16px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .th { width: 132px; padding: 8px 8px 4px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; touch-action: none; }
  .th .im { width: 112px; display: grid; place-items: center; }
  .th img { max-width: 112px; max-height: 150px; background: #fff; box-shadow: 0 1px 3px rgba(var(--shade), .6); display: block; }
  .th .no { font-size: 11px; line-height: 16px; color: var(--ink-mid); font-variant-numeric: tabular-nums; }
  .th.cur .no { color: var(--ink); font-weight: 600; }
  .th.on { box-shadow: var(--checked); }
  .th.drop-before::before, .th.drop-after::after { content: ""; position: absolute; left: 4px; right: 4px; height: 3px; border-radius: 3px; background: var(--ink); }
  .th.drop-before::before { top: -9px; } .th.drop-after::after { bottom: -9px; }
  .sideacts { flex: 0 0 auto; display: flex; justify-content: space-between; padding: 8px 12px; border-top: 1px solid var(--hair); position: relative; }
  .menu { position: absolute; z-index: 40; min-width: 180px; padding: 8px; border-radius: 12px; background: var(--material); box-shadow: var(--raise-lg); display: flex; flex-direction: column; }
  .menu button { text-align: left; padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 20px; color: var(--ink); white-space: nowrap; }
  .menu button:hover { box-shadow: var(--deboss); }
  /* 書籤 */
  .bms { padding: 6px 10px 16px; display: flex; flex-direction: column; gap: 2px; }
  .bm { display: flex; align-items: center; gap: 4px; min-height: 28px; padding: 4px 8px; border-radius: 8px; font-size: 13px; line-height: 18px; color: var(--ink); cursor: pointer; }
  .bm:hover { box-shadow: var(--deboss); }
  .bm.on { box-shadow: var(--checked); font-weight: 600; }
  .bm .tw { width: 12px; flex: 0 0 auto; color: var(--ink-off); font-size: 9px; text-align: center; }
  .bm .ti { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bm .pn { font-size: 11px; color: var(--ink-off); font-variant-numeric: tabular-nums; }
  .bm input { flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 13px; box-shadow: var(--deboss); border-radius: 6px; padding: 2px 6px; }
  .bmacts { display: flex; gap: 2px; justify-content: center; padding: 8px; border-top: 1px solid var(--hair); }
  .empty { padding: 20px 18px; font-size: 11px; line-height: 16px; color: var(--ink-mid); text-align: center; }
  /* 註解清單 */
  .cmts { padding: 6px 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .cmt { padding: 10px 12px; border-radius: 12px; box-shadow: var(--raise-sm); display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
  .cmt.on { box-shadow: var(--checked); }
  .cmt .hd1 { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-mid); }
  .cmt .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; border: 1px solid rgba(0,0,0,.12); }
  .cmt .who { font-weight: 600; color: var(--ink); }
  .cmt .pgn { margin-left: auto; font-variant-numeric: tabular-nums; }
  .cmt .tx { font-size: 13px; line-height: 18px; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
  .cmt .tx.none { color: var(--ink-off); }
  /* 回覆串：清單裡縮排列在上一層下面；便利貼那張紙、右邊選到的註解有一個回覆框 */
  .cmt .rps { display: flex; flex-direction: column; gap: 3px; margin: 2px 0 0 2px; padding-left: 10px; border-left: 2px solid rgba(0,0,0,.10); }
  .cmt .rp { font-size: 12px; line-height: 17px; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
  .cmt .rp b { font-weight: 600; margin-right: 6px; }
  .thread { display: flex; flex-direction: column; gap: 6px; }
  .thread .rp { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "rh x" "tx x"; gap: 1px 6px; font-size: 12px; line-height: 17px; }
  .thread .rp .rh { grid-area: rh; font-size: 11px; color: var(--ink-mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread .rp .rh b { font-weight: 600; color: var(--ink); margin-right: 6px; }
  .thread .rp .tx { grid-area: tx; white-space: pre-wrap; word-break: break-word; }
  .thread .rp .x { grid-area: x; align-self: start; border: 0; background: none; color: var(--ink-off); cursor: pointer; font-size: 15px; line-height: 15px; padding: 0 2px; }
  .thread .rin { width: 100%; }
  .notepop .thread { border-top: 1px solid rgba(0,0,0,.08); padding-top: 6px; }
  .notepop .thread .rp .rh, .notepop .thread .rp .x { color: #6B6E76; }
  .notepop .thread .rp .rh b, .notepop .thread .rp .tx { color: #282A2F; }
  .notepop .rin { border: 0; outline: 0; box-shadow: none; background: rgba(255,255,255,.7); border-radius: 8px; padding: 6px 8px; font-size: 12px; line-height: 16px; font-family: var(--doc); color: #282A2F; }
  .ob.file svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .ob.file.broken { opacity: .55; }
  .att { display: flex; flex-direction: column; gap: 2px; }
  .att b { font-weight: 600; word-break: break-all; }

  /* 中：頁面（白紙在材料上） */
  .cv { grid-row: 3; grid-column: 2; position: relative; overflow: auto; min-width: 0; background: var(--well); }
  .pages { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 28px 32px 80px; min-width: min-content; }
  .pg { position: relative; background: #fff; box-shadow: var(--sheet); flex: 0 0 auto; overflow: hidden; touch-action: none; isolation: isolate; }   /* 螢光筆的 multiply 只跟這頁混，不跟透明的視窗混（不然整頁會畫成黑） */
  .pg > img.pi { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .pgno { font-size: 11px; line-height: 16px; color: var(--ink-mid); margin-bottom: 12px; font-variant-numeric: tabular-nums; }
  /* 圖層本身不接滑鼠（整頁大小的透明層會把下面的東西擋住）：只有裡面的東西接；點到空白處＝點到頁面 */
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .ol > .ob, .ol > .hd, .ol > .grip, .ol > .notepop, .ff > * { pointer-events: auto; }
  body[data-tool="edit"] .tx > .pb, body[data-tool="edit"] .tx > .ib { pointer-events: auto; }
  .pb { position: absolute; border-radius: 2px; }
  body[data-tool="edit"] .pb { cursor: text; outline: 1px dashed rgba(40,42,47,.35); outline-offset: 2px; }
  body[data-tool="edit"] .pb:hover { outline: 1px solid rgba(40,42,47,.75); background: rgba(40,42,47,.04); }
  .ib { position: absolute; }
  body[data-tool="edit"] .ib { cursor: pointer; outline: 1px dashed rgba(40,42,47,.35); }
  body[data-tool="edit"] .ib:hover { outline: 1px solid rgba(40,42,47,.75); background: rgba(40,42,47,.06); }
  .tsr { position: absolute; background: var(--tsel); pointer-events: none; }
  .hit { position: absolute; background: rgba(255,200,0,.35); pointer-events: none; }
  .hit.cur { background: rgba(255,150,0,.45); outline: 1.5px solid #282A2F; }
  body[data-tool="text"] .pg, body[data-tool="edit"] .pg { cursor: text; }
  body[data-tool="select"] .pg { cursor: default; }
  body[data-tool="hl"] .pg, body[data-tool="ul"] .pg, body[data-tool="so"] .pg, body[data-tool="redact"] .pg { cursor: text; }
  body[data-tool="shape"] .pg, body[data-tool="white"] .pg, body[data-tool="pen"] .pg, body[data-tool="link"] .pg, body[data-tool="crop"] .pg, body[data-tool^="f-"] .pg, body[data-tool="ftext"] .pg { cursor: crosshair; }
  body[data-tool="eraser"] .pg { cursor: cell; }
  body[data-tool="sign"] .pg, body[data-tool="ini"] .pg, body[data-tool="image"] .pg, body[data-tool="stamp"] .pg, body[data-tool="note"] .pg,
  body[data-tool="check"] .pg, body[data-tool="cross"] .pg, body[data-tool="dot"] .pg, body[data-tool="fline"] .pg, body[data-tool="date"] .pg { cursor: copy; }

  /* 放在頁面上的東西 */
  .ob { position: absolute; transform-origin: center center; }
  .ob.para { white-space: pre-wrap; overflow-wrap: anywhere; outline: none; min-width: 4px; font-kerning: normal; }
  .ob.para.nowrap { white-space: pre; }
  .ob.para.vert { writing-mode: vertical-rl; text-orientation: upright; }     /* 直排：欄由右往左、字一律正立 */
  .ob.para[contenteditable="true"] { outline: 1px solid rgba(40,42,47,.75); outline-offset: 3px; cursor: text; user-select: text; }
  .ob.para.pending { background: #fff; }
  .cover { position: absolute; pointer-events: none; }
  .grip { position: absolute; width: 16px; height: 16px; margin: -22px 0 0 -20px; border-radius: 4px; background: #fff; border: 1.5px solid #282A2F; cursor: move; z-index: 32; display: grid; place-items: center; }
  .grip::after { content: ""; width: 8px; height: 8px; background: radial-gradient(circle, #282A2F 1px, transparent 1.2px) 0 0 / 4px 4px; }
  .ob.image img, .ob.sig img, .ob.ini img, .ob.stamp img, .ob.xann img, .ob.snap > img { width: 100%; height: 100%; display: block; pointer-events: none; }
  .ob.ximg { transform-origin: 0 0; }
  .ob.ximg img { display: block; pointer-events: none; }
  .ob.hl .q { position: absolute; mix-blend-mode: multiply; }
  .ob.ul .q, .ob.so .q { position: absolute; }
  .ob.redact { background: #000; }
  .ob.redact::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(255,255,255,.10) 0 6px, transparent 6px 12px); }
  .ob.white { background: #fff; }
  .ob.white.sel-hint { outline: 1px dashed rgba(40,42,47,.4); }
  .ob svg { width: 100%; height: 100%; overflow: visible; }
  .ob svg * { stroke-width: inherit; }
  .ob.note svg * { stroke-width: 1.4; }
  .ob.ftext { white-space: pre-wrap; overflow: hidden; font-family: var(--doc); line-height: 1.3; padding: 2px 4px; }
  .ob.ftext[contenteditable="true"] { outline: 1px solid rgba(40,42,47,.75); user-select: text; cursor: text; overflow: visible; }
  .ob.stamp .stp { position: absolute; inset: 0; border-radius: 18%/30%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--doc); font-weight: 600; line-height: 1.05; white-space: nowrap; overflow: hidden; }
  .ob.stamp .stp small { font-weight: 400; }
  .ob.field { border: 1.5px dashed rgba(40,42,47,.7); background: rgba(255,224,102,.22); display: flex; align-items: center; gap: 4px; padding: 0 4px; font-size: 10px; color: #282A2F; overflow: hidden; white-space: nowrap; font-family: var(--doc); }
  .ob.field.radio, .ob.field.check { justify-content: center; padding: 0; }
  .ob.field.radio { border-radius: 50%; }
  .ob.link { outline: 1.5px dashed rgba(31,58,147,.75); background: rgba(31,58,147,.06); }
  body:not([data-tool="link"]):not([data-tool="select"]) .ob.link:not(.picked) { visibility: hidden; }
  .ob.mark svg * { stroke-width: inherit; }
  .notepop { position: absolute; z-index: 35; width: 220px; padding: 10px 12px; border-radius: 12px; background: #FFF8D6; box-shadow: 0 2px 10px rgba(0,0,0,.18); display: flex; flex-direction: column; gap: 6px; color: #282A2F; cursor: auto; }
  .notepop .who { font-size: 11px; color: #6B6E76; }
  .notepop textarea { width: 100%; min-height: 70px; border: 0; outline: 0; background: transparent; resize: vertical; font-size: 13px; line-height: 18px; font-family: var(--doc); }
  body[data-tool="select"] .ob:not(.para[contenteditable="true"]):not(.ftext[contenteditable="true"]) { cursor: move; }
  .selbox { position: absolute; outline: 1.5px solid #282A2F; outline-offset: 2px; pointer-events: none; z-index: 30; box-shadow: 0 0 0 4px rgba(255,255,255,.5); }
  .marq { position: absolute; border: 1px dashed #282A2F; background: rgba(40,42,47,.06); pointer-events: none; z-index: 30; }
  .hd { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; background: #fff; border: 1.5px solid #282A2F; border-radius: 2px; pointer-events: auto; z-index: 31; }
  .cropbox { position: absolute; outline: 1.5px dashed #282A2F; box-shadow: 0 0 0 9999px rgba(20,22,26,.35); pointer-events: none; z-index: 29; }
  /* 表單欄位：直接在頁面上填 */
  .fi { position: absolute; border: 0; outline: 0; background: rgba(40,42,47,.05); border-bottom: 1px dotted rgba(40,42,47,.5); padding: 0 3px; color: #1E2223; font-family: var(--doc); }
  .fi:focus { background: rgba(255,224,102,.25); }
  .fc { position: absolute; border: 1px solid rgba(40,42,47,.55); background: rgba(255,255,255,.7); border-radius: 3px; display: grid; place-items: center; color: #1E2223; }
  .fc.radio { border-radius: 50%; }

  function delPages(ids) { if (!ids.length) return; if (ids.length >= pages.length) { toast(tr('至少要留一頁')); return; } pageOp('delete', { ids }); selPages = new Set(); }
  $('pDup').onclick = () => { const ids = selOrCur(); if (ids.length) pageOp('dup', { ids }); };
  $('pAdd').onclick = e => { e.stopPropagation(); $('extMenu').classList.add('hide'); $('addMenu').classList.toggle('hide'); };
  $('pExt').onclick = e => { e.stopPropagation(); $('addMenu').classList.add('hide'); $('extMenu').classList.toggle('hide'); };
  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('.menu, #pAdd, #pExt, #zVal')) { $('addMenu').classList.add('hide'); $('extMenu').classList.add('hide'); $('zoomMenu').classList.add('hide'); }
    if (!e.target.closest('#minibar, .tsr, .pg')) hideMini();
  });
  $('mBlank').onclick = () => { $('addMenu').classList.add('hide'); pageOp('blank', { after: cur }); };
  $('mFile').onclick = () => { $('addMenu').classList.add('hide'); insertFile(); };
  function insertFile() { pendingPage = { op: 'insertFiles', state: snapshot() }; send('pageOp', { op: 'insertPick', after: cur }); }
  $('mExtOne').onclick = () => { $('extMenu').classList.add('hide'); extract(false); };
  $('mExtEach').onclick = () => { $('extMenu').classList.add('hide'); extract(true); };
  function extract(each) {
    const idx = pages.map((p, i) => selPages.has(p.id) || (!selPages.size && p.id === cur) ? i + 1 : 0).filter(Boolean);
    if (!idx.length) return;
    run('extract', { pages: idx.join(','), each }, tr('取出另存'));
  }
  // 頁面模式
  function pagesAct(k) {
    const ids = selOrCur();
    if (k === 'blank') pageOp('blank', { after: ids[ids.length - 1] || cur });
    else if (k === 'insert') insertFile();
    else if (k === 'rotl') rotatePages(ids, 270);
    else if (k === 'rotr') rotatePages(ids, 90);
    else if (k === 'dup') pageOp('dup', { ids });
    else if (k === 'ext') extract(false);
    else if (k === 'trim') pageOp('crop', { ids });
    else if (k === 'del') delPages(ids);
  }
  function renderGrid() {
    const g = $('grid');
    g.innerHTML = pages.map((p, i) => `<div class="gc ${selPages.has(p.id) ? 'on' : ''}" data-id="${p.id}"><span class="im"><img src="slimly://page/${p.id}?w=360&v=${p.v}&a=1" alt="" draggable="false"></span><span class="no">${i + 1}</span>
      <span class="acts"><button data-a="rotl" title="${esc(tr('向左轉'))}">${svg(IC.rotl)}</button><button data-a="rotr" title="${esc(tr('向右轉'))}">${svg(IC.rotr)}</button><button data-a="dup" title="${esc(tr('複製'))}">${svg(IC.dup)}</button><button data-a="del" title="${esc(tr('刪掉'))}">${svg(IC.del)}</button></span></div>`).join('');
    g.querySelectorAll('.gc').forEach(c => {
      c.onpointerdown = e => thumbDown(e, c, '.gc');
      c.querySelectorAll('[data-a]').forEach(b => b.onclick = ev => { ev.stopPropagation(); const id = c.dataset.id, a = b.dataset.a; if (a === 'rotl') rotatePages([id], 270); if (a === 'rotr') rotatePages([id], 90); if (a === 'dup') pageOp('dup', { ids: [id] }); if (a === 'del') delPages([id]); });
    });
  }

  // 書籤
  function olAt(path) { let arr = OL, it = null; for (const i of path) { it = arr[i]; if (!it) return null; arr = it.kids = it.kids || []; } return it; }
  function olParent(path) { return path.length === 1 ? OL : olAt(path.slice(0, -1)).kids; }
  function renderBm() {
    const box = $('sbody');
    const rows = [];
    const walk = (arr, path, depth) => arr.forEach((it, i) => { const p = [...path, i]; rows.push({ it, p, depth }); if (!it.closed) walk(it.kids || [], p, depth + 1); });
    walk(OL, [], 0);
    const key = p => p.join('.');
    box.innerHTML = (rows.length ? `<div class="bms">${rows.map(({ it, p, depth }) => {
      const pi = pages.findIndex(x => x.id === it.page);
      return `<div class="bm ${olSel && key(olSel) === key(p) ? 'on' : ''}" data-p="${key(p)}" style="padding-left:${8 + depth * 14}px"><span class="tw">${(it.kids || []).length ? (it.closed ? '▶' : '▼') : ''}</span><span class="ti">${esc(it.title || '')}</span><span class="pn">${pi >= 0 ? pi + 1 : ''}</span></div>`;
    }).join('')}</div>` : `<div class="empty">${tr('還沒有書籤')}</div>`)
      + `<div class="bmacts"><button class="ic" data-b="add" title="${esc(tr('加書籤'))}">${svg(IC.plus)}</button><button class="ic" data-b="up">${svg(IC.up)}</button><button class="ic" data-b="down">${svg(IC.down)}</button><button class="ic" data-b="out">${svg(IC.outdent)}</button><button class="ic" data-b="in">${svg(IC.indent)}</button><button class="ic" data-b="del">${svg(IC.del)}</button></div>`;
    box.querySelectorAll('.bm').forEach(r => {
      const p = r.dataset.p.split('.').map(Number);
      r.onclick = e => {
        const it = olAt(p);
        if (e.target.classList.contains('tw')) { it.closed = !it.closed; renderBm(); return; }
        olSel = p; renderBm(); if (it.page && pg(it.page)) scrollToPage(it.page, it.y || 0);
      };
      r.ondblclick = () => {
        const it = olAt(p), ti = r.querySelector('.ti');
        ti.outerHTML = `<input value="${esc(it.title)}">`;
        const inp = r.querySelector('input'); inp.focus(); inp.select();
        const done = ok => { if (ok && inp.value.trim() && inp.value !== it.title) { record(); it.title = inp.value.trim(); olDirty = true; } renderBm(); };
        inp.onkeydown = ev => { ev.stopPropagation(); if (ev.key === 'Enter') done(true); if (ev.key === 'Escape') done(false); };
        inp.onblur = () => done(true);
      };
    });
    box.querySelectorAll('[data-b]').forEach(b => b.onclick = () => bmAct(b.dataset.b));
  }
  function bmAct(a) {
    if (a === 'add') {
      record();
      const cv = $('cv'), el = pgEl(cur); const y = el ? Math.max(0, (cv.scrollTop - el.offsetTop + 20) / z()) : 0;
      const title = (tsel && tselText().trim().slice(0, 60)) || tr('新書籤');
      const it = { title, page: cur, y, kids: [] };
      if (olSel) { const par = olParent(olSel); par.splice(olSel[olSel.length - 1] + 1, 0, it); olSel = [...olSel.slice(0, -1), olSel[olSel.length - 1] + 1]; }
      else { OL.push(it); olSel = [OL.length - 1]; }
      olDirty = true; renderBm(); return;
    }
    if (!olSel) return;
    const par = olParent(olSel), i = olSel[olSel.length - 1], it = par[i];
    record(); olDirty = true;
    if (a === 'del') { par.splice(i, 1); olSel = null; }
    if (a === 'up' && i > 0) { par.splice(i, 1); par.splice(i - 1, 0, it); olSel = [...olSel.slice(0, -1), i - 1]; }
    if (a === 'down' && i < par.length - 1) { par.splice(i, 1); par.splice(i + 1, 0, it); olSel = [...olSel.slice(0, -1), i + 1]; }
    if (a === 'in' && i > 0) { par.splice(i, 1); const prev = par[i - 1]; prev.kids = prev.kids || []; prev.kids.push(it); prev.closed = false; olSel = [...olSel.slice(0, -1), i - 1, prev.kids.length - 1]; }
    if (a === 'out' && olSel.length > 1) { par.splice(i, 1); const gp = olParent(olSel.slice(0, -1)), pi = olSel[olSel.length - 2]; gp.splice(pi + 1, 0, it); olSel = [...olSel.slice(0, -2), pi + 1]; }
    renderBm();
  }
  // 註解清單
  const TYPE_NAME = { hl: '螢光筆', ul: '底線', so: '刪除線', note: '便利貼', ftext: '文字框', rect: '方框', ellipse: '圓', line: '線', arrow: '箭頭', ink: '畫筆', stamp: '印章', xann: '註解', file: '附加檔案' };
  function renderCm() {
    const box = $('sbody'), items = [];

    items.sort((a, b) => a.i - b.i || a.y - b.y);
    box.innerHTML = items.length ? `<div class="cmts">${items.map(({ pid, i, o }) => {
      const when = o.date ? new Date(o.date * 1000).toLocaleString(LANG === 'en' ? 'en-US' : 'zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : tr('剛剛');
      const txt = o.note || (o.t === 'ftext' ? o.text : '') || (o.t === 'stamp' ? o.label : '') || (o.t === 'file' ? o.name : '') || o.text || '';
      const rs = repliesOf(pid, o);
      return `<div class="cmt ${isSel(pid, o.id) ? 'on' : ''}" data-pid="${pid}" data-oid="${o.id}"><div class="hd1"><i class="dot" style="background:${esc(o.color || o.tc || '#FFE066')}"></i><span class="who">${esc(o.author || D?.user || tr('你'))}</span><span>${esc(tr(TYPE_NAME[o.t] || '註解'))}</span><span class="pgn">p.${i + 1}</span></div>
        <div class="tx ${txt ? '' : 'none'}">${esc(txt || when)}</div>${rs.length ? `<div class="rps">${rs.map(r => `<div class="rp"><b>${esc(r.author || D?.user || tr('你'))}</b>${esc(r.note || '')}</div>`).join('')}</div>` : ''}</div>`;
    }).join('')}</div>` : `<div class="empty">${tr('還沒有註解')}</div>`;
    box.querySelectorAll('.cmt').forEach(c => c.onclick = () => {
      const pid = c.dataset.pid, o = findObj(pid, c.dataset.oid); if (!o) return;

  // ── 右：選到的東西、這個模式、整份文件 ──
  const swatches = (arr, curv, key) => arr.map(c => `<button class="sw ${String(c).toUpperCase() === String(curv || '').toUpperCase() ? 'on' : ''}" data-${key}="${c}"><i style="background:${c}"></i></button>`).join('')
    + `<button class="sw any" title="…"><i></i><input type="color" data-${key}-any value="${/^#[0-9a-f]{6}$/i.test(curv || '') ? curv : '#1E2223'}"></button>`;
  const wseg = (arr, curv, key) => `<span class="seg">${arr.map(([w, n]) => `<button class="${Math.abs((curv || 0) - w) < .01 ? 'on' : ''}" data-${key}="${w}">${tr(n)}</button>`).join('')}</span>`;
  function ctxSection() {

      return `<div class="sec ctx"><h3>${tr('選到 {n} 個', { n: s.length })}<button class="link sm" data-x="del">${tr('刪掉這個')}</button></h3>
        <span class="seg"><button data-al="left">${tr('對齊左邊')}</button><button data-al="top">${tr('對齊上面')}</button><button data-al="hc">${tr('水平置中')}</button><button data-al="dist">${tr('平均分配')}</button></span></div>`;
    }
    const x = one(), o = x?.o, t = o ? o.t : tool;
    const ed = editing ? findObj(editing.pid, editing.oid) : null;
    const P = ed || (o?.t === 'para' ? o : null);
    if (P || (!o && ['text', 'date'].includes(tool))) {
      const r0 = P ? (P.runs[0] || OPT.text) : OPT.text;
      const fams = [...new Set([r0.f, ...Object.values(objs).flat().filter(q => q.t === 'para').flatMap(q => q.runs.map(r => r.f)), ...FONTS.map(f => f.fam)])].filter(Boolean);
      const miss = P?.runs.find(r => r.src && r.ex === false);
      return `<div class="sec ctx"><h3>${tr('文字格式')}${P ? `<button class="link sm" data-x="del">${tr('刪掉這個')}</button>` : ''}</h3>
        <select class="txt-in sm" id="fFam">${fams.map(f => `<option ${f === r0.f ? 'selected' : ''} style="font-family:${esc(famCSS(f))}">${esc(f)}</option>`).join('')}</select>
        <div class="row sb"><span class="num"><button data-fs="-1">−</button><input id="fSize" value="${Math.round(r0.s * 10) / 10}"><button data-fs="1">+</button></span>
          <span class="seg"><button data-f="bold" class="${r0.wt >= 600 ? 'on' : ''}"><b>B</b></button><button data-f="italic" class="${r0.it ? 'on' : ''}"><i>I</i></button><button data-f="underline" class="${r0.u ? 'on' : ''}"><u>U</u></button><button data-f="strike" class="${r0.k ? 'on' : ''}"><s>S</s></button></span></div>
        <div class="row">${swatches(INKS, r0.c, 'tc')}</div>
        ${P ? `<div class="row sb"><span class="seg">${[['left', 'al'], ['center', 'ac'], ['right', 'ar'], ['justify', 'aj']].map(([a, ic]) => `<button data-pa="${a}" class="${(P.align || 'left') === a ? 'on' : ''}">${svg(IC[ic])}</button>`).join('')}</span>
          <select class="txt-in sm" id="fLh" style="width:88px">${[1, 1.15, 1.25, 1.5, 2].map(v => `<option value="${v}" ${Math.abs((P.lh || 1.25) - v) < .02 ? 'selected' : ''}>${v}×</option>`).join('')}${[1, 1.15, 1.25, 1.5, 2].some(v => Math.abs((P.lh || 1.25) - v) < .02) ? '' : `<option selected value="${P.lh}">${(+P.lh).toFixed(2)}×</option>`}</select></div>` : ''}
        ${miss ? `<span class="t-cap">${esc(tr('原本的字型「{a}」這台沒有，用「{b}」代替', { a: miss.src, b: miss.f }))}</span>` : ''}</div>`;
    }
    if (!o) {
      if (['hl', 'ul', 'so'].includes(t)) return `<div class="sec ctx"><h3>${tr({ hl: '螢光筆', ul: '底線', so: '刪除線' }[t])}</h3><div class="row">${swatches(t === 'hl' ? HLS : SHP, OPT[t].color, 'oc')}</div></div>`;
      if (t === 'pen') return `<div class="sec ctx"><h3>${tr('畫筆')}</h3><div class="row">${swatches(SHP, OPT.pen.color, 'oc')}</div>${wseg([[1, '細'], [2, '中'], [4, '粗']], OPT.pen.width, 'ow')}</div>`;
      if (t === 'shape') return `<div class="sec ctx"><h3>${tr('形狀')}</h3><span class="seg">${[['rect', '方框'], ['ellipse', '圓'], ['arrow', '箭頭'], ['line', '線']].map(([k, n]) => `<button class="${OPT.shape.kind === k ? 'on' : ''}" data-kind="${k}">${tr(n)}</button>`).join('')}</span>
        <div class="row">${swatches(SHP, OPT.shape.color, 'oc')}</div>${wseg([[1, '細'], [2, '中'], [4, '粗']], OPT.shape.width, 'ow')}</div>`;
      if (t === 'note') return `<div class="sec ctx"><h3>${tr('便利貼')}</h3><div class="row">${swatches(HLS, OPT.note.color, 'oc')}</div></div>`;
      if (t === 'ftext') return `<div class="sec ctx"><h3>${tr('文字框')}</h3><div class="row">${swatches(SHP, OPT.ftext.tc, 'oc')}</div></div>`;
      if (t === 'stamp') return `<div class="sec ctx"><h3>${tr('印章')}</h3><div class="stamps">${STAMPS.map(k => `<button class="${OPT.stamp.label === k && !OPT.stamp.custom ? 'on' : ''}" data-stl="${esc(k)}" style="color:${OPT.stamp.color}">${esc(tr(k))}</button>`).join('')}</div>
        <input class="txt-in sm" id="stCustom" placeholder="${esc(tr('自己打的字'))}" value="${esc(OPT.stamp.custom)}">
        <div class="row">${swatches(['#D0342C', '#1F3A93', '#1E8C4E'], OPT.stamp.color, 'oc')}</div>
        <div class="row sb"><span class="t-body">${tr('加上日期與名字')}</span><button class="tog ${OPT.stamp.sub ? 'on' : ''}" data-tg="stsub"></button></div>
        <button class="link sm" data-x="stimg">${tr('選一張圖…')}</button></div>`;
      if (['check', 'cross', 'dot', 'fline'].includes(t)) return `<div class="sec ctx"><h3>${tr(HINT[t] ? { check: '打勾', cross: '打叉', dot: '圓點', fline: '橫線' }[t] : '')}</h3><div class="row">${swatches(INKS, OPT.mark.color, 'oc')}</div></div>`;
      if (t === 'crop' && cropDraft) return `<div class="sec ctx"><h3>${tr('裁切頁面')}</h3><span class="t-cap">${tr('套用到：')}</span><span class="seg"><button data-crop="this">${tr('這頁')}</button><button data-crop="sel">${tr('所選的頁 ')}</button><button data-crop="all">${tr('所有頁')}</button></span><button class="link sm" data-x="cropx">${tr('取消')}</button></div>`;
      return '';
    }
    let h = '';
    const title = { file: '附加檔案', xfield: '表單', image: '圖片', sig: '簽名', ini: '縮寫', ximg: '圖片', mark: '符號', white: '擦掉一塊（W）：框裡的字與圖真的刪掉，留白', redact: '塗黑', link: '連結', field: '表單', stamp: '印章', note: '便利貼', ftext: '文字框', hl: '螢光筆', ul: '底線', so: '刪除線', rect: '方框', ellipse: '圓', line: '線', arrow: '箭頭', ink: '畫筆', xann: '註解' }[o.t] || '';
    h += `<div class="sec ctx"><h3><span class="one">${esc(tr(title))}</span><button class="link sm" data-x="del">${tr('刪掉這個')}</button></h3>`;

    if (['image', 'sig', 'ini'].includes(o.t)) h += `<span class="seg"><button data-x="irot">${tr('轉 90°（圖）')}</button></span><div class="row sb"><span class="t-cap">${tr('不透明度')}</span>${wseg([[1, '100%'], [0.7, '70%'], [0.4, '40%']], o.opacity ?? 1, 'op')}</div>`;
    if (o.t === 'mark') h += `<div class="row">${swatches(INKS, o.color, 'oc')}</div>`;
    if (['hl', 'note'].includes(o.t)) h += `<div class="row">${swatches(HLS, o.color, 'oc')}</div>`;
    if (['ul', 'so', 'rect', 'ellipse', 'line', 'arrow', 'ink'].includes(o.t)) h += `<div class="row">${swatches(SHP, o.color, 'oc')}</div>`;
    if (['rect', 'ellipse', 'line', 'arrow', 'ink'].includes(o.t)) h += wseg([[1, '細'], [2, '中'], [4, '粗']], o.width, 'ow');
    if (['rect', 'ellipse'].includes(o.t)) h += `<div class="row sb"><span class="t-cap">${tr('填色')}</span><span class="seg"><button class="${!o.fill ? 'on' : ''}" data-fill="">${tr('沒有')}</button>${['#FFE066', '#FFFFFF', '#E6E8EC'].map(c => `<button class="${o.fill === c ? 'on' : ''}" data-fill="${c}"><i style="width:12px;height:12px;border-radius:50%;background:${c};border:1px solid rgba(0,0,0,.15)"></i></button>`).join('')}</span></div>`;

      if (o.ft === 'text') h += `<div class="row sb"><span class="t-body">${tr('可以打多行')}</span><button class="tog ${o.multi ? 'on' : ''}" data-tg="fdmulti"></button></div>`;
      if (o.ft === 'choice') h += `<span class="t-cap">${tr('選項（一行一個）')}</span><textarea class="txt-in" id="fdOpts">${esc((o.opts || []).join('\n'))}</textarea>`;

      if (o.ft !== 'sig') h += `<div class="row sb"><span class="t-body">${tr('必填')}</span><button class="tog ${o.req ? 'on' : ''}" data-tg="fdreq"></button></div>`;
    }
    if (o.t === 'file') h += `<div class="att"><b>${esc(o.name || tr('附件'))}</b><span class="t-cap">${o.size >= 0 ? fmtBytes(o.size) : ''}${o.has === false ? (o.size >= 0 ? ' · ' : '') + tr('只有檔名，沒有內容') : ''}</span></div><div class="row"><button class="cap-key sm" data-x="fsave">${tr('存出這個檔…')}</button></div>`;
    if (ANN.has(o.t) && o.t !== 'note') h += `<span class="t-cap">${tr(o.t === 'file' ? '說明' : '內容')}</span><textarea class="txt-in" id="annNote" placeholder="${esc(tr(o.t === 'file' ? '這個檔是什麼…' : '在這裡回覆…'))}">${esc(o.note || '')}</textarea>`;
    if (o.aid !== undefined && o.author) h += `<span class="t-cap">${tr('作者')}：${esc(o.author)}</span>`;
    if (ANN.has(o.t) && o.t !== 'note') { const n = repliesOf(x.pid, o).length; h += `<span class="t-cap">${tr('回覆')}${n ? ` ${n}` : ''}</span>` + threadHTML(x.pid, o); }

    field: (i, ft, x, y, w, h, name) => { addField(pages[i].id, ft, { x, y, w, h }); const o = list(pages[i].id).slice(-1)[0]; if (name) o.name = name; return 'ok'; },
    link: (i, x, y, w, h, url) => { const id = pages[i].id; record(); addObj(id, { t: 'link', x, y, w, h, url }); renderObjs(pgEl(id), id); return 'ok'; },
    bookmark: (i, title) => { record(); OL.push({ title, page: pages[i].id, y: 0, kids: [] }); olDirty = true; return 'ok'; },
    rotate: i => { rotatePages([pages[i].id], 90); return 'ok'; },
    move: (i, to) => { pageOp('move', { ids: [pages[i].id], to }); return 'ok'; },
    del: i => { pageOp('delete', { ids: [pages[i].id] }); return 'ok'; },
    blank: () => { pageOp('blank', { after: pages[pages.length - 1].id }); return 'ok'; },
    pn: on => { record(); fx.pn = on ? { ...pnDraft, fmt: 'nN' } : null; renderAll(); return 'ok'; },
    hf: v => { record(); fx.hf = v ? { ...hfDraft, ...v } : null; renderAll(); return 'ok'; },
    wm: text => { record(); fx.wm = text ? { ...wmDraft, text } : null; renderAll(); return 'ok'; },
    bg: c => { record(); fx.bg = c ? { color: c, opacity: 1 } : null; renderAll(); return 'ok'; },
    meta: m => { record(); Object.assign(META, m); metaDirty = true; return 'ok'; },
    sanitize: v => { san = { meta: !!v, files: !!v, js: !!v }; return 'ok'; },
    fill: (name, v) => { record(); forms[name] = v; renderAllFields(); return 'ok'; },
    find: presets => { send('find', { presets, terms: [] }); return 'ok'; },
    search: q => { $('findIn').value = q; runSearch(); return 'ok'; },
    protect: pw => { prot = { ...prot, on: true, pw, pw2: pw, keep: false }; renderPanel(); return 'ok'; },
    restrict: (pw, perms) => { prot = { ...prot, lim: true, opw: pw, opw2: pw, ...perms }; return 'ok'; },
    save: () => { save(); return 'ok'; }, undo: () => { undo(); return 'ok'; }, redo: () => { redo(); return 'ok'; },
    makeIni: () => { strokesS = [[[10, 40], [25, 10], [40, 40]], [[15, 28], [35, 28]], [[55, 10], [55, 40]]]; send('saveSignature', { data: sigPNG(), which: 'ini' }); strokesS = []; return 'ok'; },
    ini: (i, x, y) => { if (!sigs.ini?.token) return 'no ini'; placeImage(pages[i].id, x, y, { token: sigs.ini.token, w: sigs.ini.w, h: sigs.ini.h }, 'ini'); return 'ok'; },
    crop: (i, x, y, w, h, scope) => { cropDraft = { pid: pages[i].id, t: 'crop', x, y, w, h }; applyCrop(scope || 'all'); return 'ok'; },
    align: how => { alignSel(how); return JSON.stringify(selObjs().map(x => +objBox(x.o).x.toFixed(2))); },
    selType: (i, t) => { const id = pages[i].id; sel = list(id).filter(o => o.t === t).map(o => ({ pid: id, oid: o.id })); renderObjs(pgEl(id), id); return sel.length; },
    selAll: i => { const id = pages[i].id; sel = list(id).filter(o => o.aid === undefined && o.t !== 'ximg').map(o => ({ pid: id, oid: o.id })); renderObjs(pgEl(id), id); return sel.length; },
    bm: (a, path) => { olSel = path || olSel; bmAct(a); return JSON.stringify(OL.map(o => [o.title, (o.kids || []).length])); },
    key: name => { onKey(name); return 'ok'; },
    wmBehind: on => { if (fx.wm) { record(); fx.wm.behind = !!on; renderAll(); } return 'ok'; },
    makeSig: () => { strokesS = [[[10, 40], [30, 10], [50, 45], [70, 12], [95, 40]], [[20, 30], [90, 22]]]; send('saveSignature', { data: sigPNG(), which: 'sig' }); strokesS = []; return 'ok'; },
    dup: i => { pageOp('dup', { ids: [pages[i].id] }); return 'ok'; },
    unlock: pw => { send('unlock', { password: pw }); return 'ok'; },
    run: (t, o) => { run(t, o || {}, t); return 'ok'; }, zoom: v => { setZoom(v); return 'ok'; },
    select: (i, k) => { const id = pages[i].id; select(id, list(id)[k]?.id); return 'ok'; },
    spec: () => JSON.stringify(spec()).slice(0, 4000),
  };

  setState('loading'); document.body.dataset.tool = 'select'; document.body.dataset.mode = 'edit';
  document.querySelector('#modes [data-mode="edit"]').classList.add('on');
  translateStatic(); setSide('pages');
  send('ready');
})();
</script>
